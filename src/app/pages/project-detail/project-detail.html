<div class="detail-wrapper" appFadeIn>
  <div class="detail-card">
    <div class="detail-header">
      <p class="breadcrumb">PROJECTS / {{projectItem?.category}}</p>
      <h1>{{projectItem?.title}}</h1>
    </div>

    <div class="detail-body">
      <div class="gallery">
        <img ngSrc="{{projectItem?.imgLink}}" height="600" width="500" alt="">
      </div>

      <div class="info">
        <h2>{{projectItem?.title}}</h2>
        <p class="desc">{{projectItem?.desc}}</p>

        <div class="spec">
          <span class="spec-label">Wood Type</span>
          <span class="spec-value">{{projectItem?.woodType}}</span>
        </div>

        <div class="spec">
          <span class="spec-value">{{projectItem?.woodDesc}}</span>
        </div>

        <div class="spec">
          <span class="spec-label">Finish</span>
          <span class="spec-value">{{projectItem?.finishType}}</span>
        </div>
        <div class="spec">
          <span class="spec-value">{{projectItem?.finishDesc}}</span>
        </div>

        <mat-divider></mat-divider>

        <!--Back button-->
        <a mat-button (click)="goBack()" class="back-btn">
          ← Back to projects
        </a>
      </div>
    </div>
  </div>
</div>
