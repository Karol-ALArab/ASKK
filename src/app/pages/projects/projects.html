<h1>Projects</h1>
<mat-divider></mat-divider>

<div class="container">
@for (project of projectList; track project;) {
  <mat-card class="project-card" appearance="outlined" (click)="onSelect(project.id)">
    <mat-card-header>
      <div mat-card-avatar class="project-header-image"></div>
      <mat-card-title>{{project.title}}</mat-card-title>
      <mat-card-subtitle>{{project.category}}</mat-card-subtitle>
    </mat-card-header>
    <img mat-card-image ngSrc="{{project.imgLink}}" alt="unable to load image" height="500" width="400">
    <mat-card-content>
      <p>
        {{project.desc}}
      </p>
    </mat-card-content>
  </mat-card>
}
</div>
