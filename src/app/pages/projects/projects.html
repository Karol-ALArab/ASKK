
<section class="projects-view container" appFadeIn>

  <div class="projects-header">
    <div class="header-left">
      <section class="hero">
        <h1>Projects</h1>
      </section>
      <div class="filter-bar">
        <button mat-button class="filter-btn active">ALL</button>
        <button mat-button class="filter-btn">TABLES</button>
        <button mat-button class="filter-btn">DESKS</button>
        <button mat-button class="filter-btn">MUGS</button>
        <button mat-button class="filter-btn">PENS</button>
      </div>
    </div>

    <div class="header-center">
      <img src="JM_LOGO_ICON.png" alt="JM Woodworking" class="center-logo">
    </div>
  </div>

  <mat-divider class="dark-divider"></mat-divider>

  <div class="projects-grid" appFadeIn>
    @for (project of projectList; track project;) {
      <mat-card class="glass-project-card" appearance="outlined" (click)="onSelect(project.id)" appHoverAnim>
        <div class="card-image-box">
          <mat-chip class="category-pill">{{project.category}}</mat-chip>
          <img ngSrc="{{project.imgLink}}" alt="unable to load image" height="300" width="400" class="card-img">
        </div>

        <div class="card-content-box">
          <h2 class="project-title">{{project.title}}</h2>
          <p class="project-desc">{{project.desc}}</p>

          <div class="view-details-btn">
            <button mat-button>View Details</button>
          </div>
        </div>

      </mat-card>
    }

  </div>
</section>
